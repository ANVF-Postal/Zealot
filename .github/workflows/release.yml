name: Release binaries

# Publish a GitHub Release from the Releases page to build and attach binaries.
# workflow_dispatch permits a dry run: its archives remain Actions artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile and package Zealot
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" != "release" ]]; then
            version="dev-${GITHUB_SHA:0:7}"
          fi
          platform="${GOOS}-${GOARCH}"
          if [[ "${GOARCH}" == "arm" ]]; then platform="${platform}v${GOARM}"; fi
          archive="zealot-${version}-${platform}.tar.gz"
          mkdir -p dist package
          go build -trimpath -ldflags "-s -w -X main.appVersion=${version}" -o package/zealot .
          tar -czf "dist/${archive}" -C package zealot
          echo "Built dist/${archive}"

      - name: Store release archive
        uses: actions/upload-artifact@v4
        with:
          name: zealot-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach binaries to GitHub Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: zealot-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
